[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "umbrella"
version = "0.1.0"
description = "Climate-Adaptive Microfinance Intelligence Platform"
readme = "docs/OPEN_SOURCE_REUSE.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.28",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
